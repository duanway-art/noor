<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Noor Privacy Policy" />
    <title>Privacy Policy — Noor</title>
    <link rel="icon" href="assets/icon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif:wght@500;600;700&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="pattern-bg legal-page-body" data-legal-document="privacy.html">
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="index.html">
          <img src="assets/icon.png" width="40" height="40" alt="Noor" />
          <span>Noor</span>
        </a>

        <button
          class="nav-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="site-nav"
          aria-label="Menu"
        >
          ☰
        </button>

        <nav id="site-nav" class="site-nav" aria-label="Main">
          <a href="index.html" data-i18n="nav.home">Home</a>
          <a href="index.html#download" data-i18n="nav.download">Download</a>
          <a href="terms.html" data-i18n="nav.terms">User Agreement</a>
        </nav>

        <div class="header-actions">
          <label class="visually-hidden" for="lang-select">Language</label>
          <select id="lang-select" aria-label="Language"></select>
        </div>
      </div>
    </header>

    <main class="legal-page">
      <div class="container">
        <a class="legal-back" href="index.html" data-i18n="legal.backHome">← Back to home</a>
        <article id="legal-content" class="legal-document" aria-live="polite">
          <p class="legal-loading" data-i18n="legal.loading">Loading…</p>
        </article>
      </div>
    </main>

    <footer class="site-footer site-footer--compact">
      <div class="container">
        <nav class="footer-links" aria-label="Legal">
          <a href="privacy.html" data-i18n="nav.privacy">Privacy Policy</a>
          <a href="terms.html" data-i18n="nav.terms">User Agreement</a>
        </nav>
        <p class="footer-rights" data-i18n="footer.rights">© Noor Quran. All rights reserved.</p>
      </div>
    </footer>

    <style>
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        border: 0;
      }
    </style>

    <script src="js/i18n.js"></script>
    <script src="js/locale-detect.js"></script>
    <script src="js/legal-page.js"></script>
  </body>
</html>
